[package]
name = "vanta"
description = "A native text editor built from the editing experience outward"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
version = "0.1.0"
publish = false

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
unicode-segmentation = "=1.13.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

