[workspace]
members = [
    "crates/app",
    "crates/cli",
    "crates/commands",
    "crates/document",
    "crates/file-io",
    "crates/keybindings",
    "crates/session",
    "crates/workspace",
    "crates/extension-protocol",
    "crates/extension-host",
    "crates/language",
    "crates/platform",
    "crates/lsp",
    "crates/config",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
version = "0.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

